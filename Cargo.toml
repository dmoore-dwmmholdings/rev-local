[workspace]
resolver = "2"
members = [
    "crates/revlocal-core",
    "crates/revlocal-store",
    "crates/revlocal-vcs",
    "crates/revlocal-engine",
    "crates/revlocal-mcp",
    "crates/revlocal-publish",
    "crates/revlocal-daemon",
    "crates/revlocal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/dmoore-dwmmholdings/rev-local"
authors = ["rev-local contributors"]

# Shared dependency versions. Member crates reference these with
# `dep = { workspace = true }` so versions never drift between crates.
[workspace.dependencies]
revlocal-core = { path = "crates/revlocal-core" }
revlocal-store = { path = "crates/revlocal-store" }
revlocal-vcs = { path = "crates/revlocal-vcs" }
revlocal-engine = { path = "crates/revlocal-engine" }
revlocal-mcp = { path = "crates/revlocal-mcp" }
revlocal-publish = { path = "crates/revlocal-publish" }
revlocal-daemon = { path = "crates/revlocal-daemon" }

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
globset = "0.4"
handlebars = "6"
tar = "0.4"
nix = { version = "0.29", default-features = false, features = ["signal"] }
# rustls, not native-tls: no OpenSSL to find at build time on three platforms, and
# no system trust store to differ between them. Trama is a remote server, so TLS is
# not optional.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
jsonschema = { version = "0.33", default-features = false }
# The first regex in the workspace. `andare_key_regex` and `merge_detect_regex`
# are user-configurable patterns (SPEC §13.1), so a real engine is required —
# they cannot be hand-parsed.
# `unicode-case` is not optional decoration: SPEC §13.2's own default
# `merge_detect_regex` opens with `(?i)`, and without this feature that pattern
# fails to compile *at runtime* — a default that ships broken. Same for any
# case-insensitive pattern a user writes in `work_item_regex`.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# `svn log --xml` is the only machine-readable form svn offers, and its attribute
# order varies between revisions — a hand-rolled parser would be guessing at
# another tool's output, which ADR 0023 is about.
quick-xml = { version = "0.37", features = ["serialize"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tempfile = "3"   # YAML: maintained fork of the deprecated serde_yaml
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
trybuild = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Enforced workspace-wide: no unwrap()/expect() outside tests.
# clippy.toml sets allow-unwrap-in-tests / allow-expect-in-tests so test code is exempt.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
