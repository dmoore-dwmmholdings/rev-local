name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One bash for all three OSes (Windows runners ship Git Bash), so every leg runs
# byte-identical shell and `set -o pipefail` is available everywhere. SPEC §16.3.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang is the failure mode this matrix exists to catch, and without a bound
    # it is also the failure mode that produces no signal: GitHub's default is six
    # hours, during which the job is neither passing nor failing and the logs are
    # never uploaded. Forty-five minutes is roughly three times the slowest green
    # run (Windows, ~15 min), so a real slowdown still passes and a deadlock fails
    # with its artifacts intact.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # M11 (Subversion support) needs a real `svn` on every runner. Installing it
      # here rather than in the SVN milestone means the SVN legs cannot be green on
      # a runner that never had the binary.
      - name: Install Subversion (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Install Subversion (macOS)
        if: runner.os == 'macOS'
        run: brew install subversion

      # Chocolatey edits the *machine* PATH, which a later step's shell does not
      # inherit — and the package's own layout is not guessable: `choco install svn`
      # is win32svn, which lands in "Program Files (x86)\Subversion", not the
      # SlikSVN path this step used to assume. So find the binary and put its real
      # directory on GITHUB_PATH, failing loudly if it is not there at all.
      - name: Install Subversion (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install svn --no-progress -y
          svn_dir=""
          for root in "/c/Program Files (x86)/Subversion/bin" "/c/Program Files/Subversion/bin" "/c/Program Files/SlikSvn/bin"; do
            if [ -x "$root/svn.exe" ]; then svn_dir="$root"; break; fi
          done
          if [ -z "$svn_dir" ]; then
            svn_dir="$(dirname "$(find '/c/Program Files' '/c/Program Files (x86)' -name svn.exe -print -quit 2>/dev/null)")"
          fi
          if [ ! -x "$svn_dir/svn.exe" ]; then
            echo "svn.exe not found after choco install svn" >&2
            exit 1
          fi
          echo "found svn at $svn_dir"
          cygpath -w "$svn_dir" >> "$GITHUB_PATH"

      - name: Verify svn is on PATH
        run: svn --version --quiet

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-all-crates: true

      - name: Create log directory
        run: mkdir -p artifacts/logs artifacts/gui

      # SQLX_OFFLINE is set in .cargo/config.toml, so the macros read the
      # committed .sqlx metadata and CI needs no database. This asserts the
      # metadata is actually present — a missing .sqlx would otherwise fail with
      # a confusing "set DATABASE_URL" error rather than naming the real problem.
      - name: Check sqlx offline metadata is committed
        run: |
          test -d crates/revlocal-store/.sqlx \
            || { echo "crates/revlocal-store/.sqlx is missing; run: cargo sqlx prepare"; exit 1; }

      - name: cargo fmt
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee artifacts/logs/fmt-${{ matrix.os }}.log

      - name: cargo clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 \
            | tee artifacts/logs/clippy-${{ matrix.os }}.log

      # The `desktop` feature is off by default, so the step above never compiles
      # the Tauri shell — and a lint that never runs is not a lint. This caught a
      # real ADR 0003 violation (`.expect()` in `main`) that had been sitting in
      # `revlocal-desktop.rs` unseen.
      #
      # macOS only, deliberately. The webview is part of the OS here, while on
      # Linux linking Tauri pulls webkit2gtk and a dozen system packages — making
      # every leg install a browser engine to lint one crate is a poor trade. One
      # runner that compiles it is enough to keep the file honest.
      # `tauri.conf.json` points `frontendDist` at `ui/dist`, and Tauri's build
      # script fails at *compile* time if that directory is absent — it is a build
      # input, not a runtime one. `ui/dist` is generated and gitignored, so it
      # exists on a developer's machine and never on a fresh checkout. That is
      # exactly how the step below passed locally and failed here on its first run.
      # Tauri needs webkit2gtk and its friends on Linux, and nowhere else. This is
      # the standing cost of REVL-87's "launches on all three platforms": ~30s of
      # apt on every Linux run, forever.
      #
      # Paid because the alternative is a desktop app whose Linux build is never
      # exercised until somebody tries to package one (REVL-101), and because a
      # third renderer — WebKitGTK, against WKWebView and WebView2 — is exactly
      # the kind of difference that only shows up when compiled.
      #
      # Capture is still not run here; ADR 0032 keeps that a local gate.
      - name: install the Linux webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev xvfb

      - name: build the desktop front end
        # Every platform now compiles the shell, so every platform needs `ui/dist`.
        if: always()
        run: npm --prefix crates/revlocal-tauri/ui ci && npm --prefix crates/revlocal-tauri/ui run build

      - name: cargo clippy (desktop shell)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          cargo clippy -p revlocal-tauri --features desktop --all-targets -- -D warnings 2>&1 \
            | tee artifacts/logs/clippy-desktop-${{ matrix.os }}.log

      # REVL-87's first criterion is that the app launches on all three platforms.
      # A CI runner has no desktop session, so launching is not something this can
      # check — but *compiling* is a necessary part of it, and the desktop shell
      # has never been compiled anywhere but this one macOS machine.
      #
      # Windows needs no extra packages for it: WebView2 ships with the runner
      # image and MSVC is already here for the rest of the build. Linux is the
      # expensive one — Tauri pulls webkit2gtk and a dozen system libraries there —
      # so it stays out until somebody decides that trade is worth making.
      #
      # `build`, not `clippy`: the lint runs on macOS and lints the same source.
      # What this adds is whether it links on a second platform.
      - name: cargo build (desktop shell)
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo build -p revlocal-tauri --features desktop --bin revlocal-desktop 2>&1 \
            | tee artifacts/logs/build-desktop-${{ matrix.os }}.log

      # Compiling is necessary for REVL-87's "launches on all three platforms" and
      # nowhere near sufficient. This starts the thing.
      #
      # What it actually proves: the process reaches and stays past Tauri's
      # `run()` — so WebView2 is present, `tauri.conf.json` parses, the capability
      # file is valid, and the tray builds. Every one of those failed here at some
      # point and none of them are visible to a compiler.
      #
      # What it does NOT prove: that a window rendered anything. That needs a
      # desktop session and a capture tool, and is REVL-90's question rather than
      # this step's. The check is deliberately the weaker one it can actually make.
      #
      # The failure branch prints both streams, and that is deliberate rather than
      # belt-and-braces. `main` returns an exit code for errors `run()` hands
      # back, but a failure inside Tauri's *setup hook* never reaches it: Tauri
      # panics there, in a non-unwinding context, and the process aborts. Verified
      # by breaking setup on purpose and reading what came out.
      #
      # So the signal this step trusts is the absence of the ready line, and the
      # diagnosis comes from captured stderr — which does carry Tauri's real
      # message ("Failed to setup app: ..."). Relying on the exit code would have
      # been relying on a path that does not run.
      # Xvfb, because a runner has no display and Tauri will not create a window
      # without one. This is not capture — ADR 0032 — it is the same "did it start
      # and make a window" check Windows runs, on the third renderer.
      - name: smoke test the desktop shell (Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          REVLOCAL_SMOKE=1 xvfb-run -a ./target/debug/revlocal-desktop \
            > artifacts/logs/desktop-smoke.out \
            2> artifacts/logs/desktop-smoke.err &
          pid=$!

          ready=""
          for _ in $(seq 1 40); do
            if grep -q "window ready" artifacts/logs/desktop-smoke.out 2>/dev/null; then
              ready=yes
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          if [ -n "$ready" ]; then
            echo "the desktop shell created its window and tray"
            exit 0
          fi

          echo "the desktop shell never reported a window in 40s" >&2
          echo "--- stdout ---" >&2; cat artifacts/logs/desktop-smoke.out >&2
          echo "--- stderr ---" >&2; cat artifacts/logs/desktop-smoke.err >&2
          exit 1

      - name: smoke test the desktop shell
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          REVLOCAL_SMOKE=1 ./target/debug/revlocal-desktop.exe \
            > artifacts/logs/desktop-smoke.out \
            2> artifacts/logs/desktop-smoke.err &
          pid=$!

          # Poll for the ready line rather than sleeping a fixed time: a fast
          # runner passes in a second, and a hang is caught at the bound instead
          # of being waited out.
          ready=""
          for _ in $(seq 1 40); do
            if grep -q "window ready" artifacts/logs/desktop-smoke.out 2>/dev/null; then
              ready=yes
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          if [ -n "$ready" ]; then
            echo "the desktop shell created its window and tray"
            exit 0
          fi

          echo "the desktop shell never reported a window in 40s" >&2
          echo "--- stdout ---" >&2; cat artifacts/logs/desktop-smoke.out >&2
          echo "--- stderr ---" >&2; cat artifacts/logs/desktop-smoke.err >&2
          exit 1

      - name: cargo build
        run: |
          set -o pipefail
          cargo build --workspace 2>&1 | tee artifacts/logs/build-${{ matrix.os }}.log

      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee artifacts/logs/test-${{ matrix.os }}.log

      # Failure is when the logs and any Framewatch captures are worth having.
      # Not `always()`: a green run has nothing to explain.
      #
      # `cancelled()` as well as `failure()`, because a job killed by
      # `timeout-minutes` reports **cancelled**, not failed — so `if: failure()`
      # alone skips this step on exactly the run that most needs it. Observed on
      # run 33160541055: the Windows leg hit the 45-minute bound, this step was
      # skipped, and the hang produced no artifacts at all. The bound without the
      # upload only makes a hang cheaper, not diagnosable.
      - name: Upload logs and GUI captures on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/**
            artifacts/gui/*.png
          if-no-files-found: warn
          retention-days: 14
