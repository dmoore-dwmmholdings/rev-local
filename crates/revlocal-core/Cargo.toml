[package]
name = "revlocal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Domain types, configuration, errors and the risk model. No I/O dependencies (SPEC §4.1)."

[dependencies]
# chrono without the `clock` feature: the domain crate represents timestamps but
# never reads the system clock, which keeps it free of ambient I/O (SPEC §4.1).
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
